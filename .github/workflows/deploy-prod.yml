# FORGE — deploy para Produção. Gerido pelo pack `github`; não se edita.
# forge-template: deploy-prod 1.0
#
# Uma release é uma tag `vX.Y.Z` sobre **o mesmo commit** que passou em Qual
# (D-4). Antes de instalar, o FORGE pergunta se o commit pode ir para
# Produção (ADR-0008): validado em Qual, o PR de release aprovado pela
# Functional Authority, todos os trabalhos referidos, a janela, o rollback e
# a segregação. Sem isso, o workflow para.
#
# **Não se constrói outra vez** (M08): instala-se o artefacto que o
# deploy-qual.yml construiu para este commit, depois de conferir o commit e
# o SHA-256 de cada ficheiro.
#
# O que é do projeto vive fora deste ficheiro:
#
#   .github/forge/deploy-prod.sh   instala em produção o artefacto que está
#                                  em "$FORGE_ARTIFACT_DIR".
#
# Sem ele, o workflow **falha**. O environment `prod` (Settings →
# Environments) diz quem aprova o deploy — a Functional Authority — e em que
# ramos ou tags; o estado do deploy fica nos GitHub Deployments.

name: Deploy Prod

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Prod
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      checks: read
      deployments: read
      pull-requests: read
      issues: read
      actions: read
    steps:
      - name: Checkout do commit exato da tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Python para o FORGE
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Instalar o FORGE
        run: python -m pip install "${FORGE_SOURCE:?a variável do repositório FORGE_SOURCE tem de dizer que FORGE instalar}"
        env:
          FORGE_SOURCE: ${{ vars.FORGE_SOURCE }}

      - name: forge status --promotion --target prod — este commit pode ir para Produção
        run: forge status --promotion "${GITHUB_SHA}" --target prod
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: O run de Qual que construiu este commit
        id: qual
        run: |
          run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy-qual.yml --commit "$GITHUB_SHA" --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          test -n "$run_id"
          test "$run_id" != "null"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: O artefacto de Qual — não se constrói outra vez
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: forge-artifact-${{ github.sha }}
          path: ${{ runner.temp }}/forge-artifact
          run-id: ${{ steps.qual.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: O mesmo artefacto — o commit e o SHA-256 de cada ficheiro
        run: |
          cd "$FORGE_ARTIFACT_DIR"
          test "$(cat FORGE_COMMIT)" = "$GITHUB_SHA"
          sha256sum --check --strict SHA256SUMS
        env:
          FORGE_ARTIFACT_DIR: ${{ runner.temp }}/forge-artifact

      - name: Preparar o projeto (.github/forge/setup)
        if: hashFiles('.github/forge/setup/action.yml') != ''
        uses: ./.github/forge/setup

      - name: Deploy para Produção (.github/forge/deploy-prod.sh)
        run: bash .github/forge/deploy-prod.sh
        env:
          FORGE_ARTIFACT_DIR: ${{ runner.temp }}/forge-artifact

# FORGE — reavaliar a prontidão quando chega uma revisão. Gerido pelo pack
# `github`; não se edita.
# forge-template: forge-reevaluate 1.0
#
# Uma aprovação (ou uma revisão retirada) muda a prontidão, e não muda o
# conteúdo: **não se verifica outra vez.** Este workflow procura o run do
# `forge.yml` para a **mesma cabeça do PR** e volta a correr **só o job
# `FORGE ready`** desse run — que lê o recibo do job `FORGE verify` do mesmo
# run e corre `forge status --require-ready`. Os testes não voltam a correr.
#
# Porquê voltar a correr o job, e não ter aqui um job `FORGE ready`: uma
# check com o mesmo nome, vinda de outro workflow, **não substitui** a do
# `forge.yml` — o GitHub exige as duas, e a vermelha bloqueia o merge mesmo
# com a nova verde (encontrado na prova de saída da Wave 1). Voltar a correr
# o job substitui a check no mesmo run.
#
# **Sem run deste commit, falha** — nunca dá `READY` sem a verificação. Se o
# run ainda está a correr, espera que acabe.

name: FORGE reevaluate

on:
  pull_request_review:
    types: [submitted, dismissed]

# Só a escrita de que precisa: voltar a correr um job deste repositório.
permissions:
  actions: write

concurrency:
  group: forge-ready-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  reevaluate:
    name: FORGE reevaluate
    runs-on: ubuntu-latest
    steps:
      - name: Voltar a correr o FORGE ready da verificação desta cabeça
        run: |
          run_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/forge.yml/runs?head_sha=${HEAD_SHA}&event=pull_request&per_page=1" --jq '.workflow_runs[0].id // empty')"
          test -n "${run_id}" || { echo "::error::não há verificação do forge.yml para ${HEAD_SHA}: a prontidão não se avalia sem ela"; exit 1; }
          for _ in $(seq 1 60); do
            estado="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq .status)"
            test "${estado}" = "completed" && break
            sleep 10
          done
          test "${estado}" = "completed" || { echo "::error::o run ${run_id} não terminou a tempo"; exit 1; }
          job_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs" --jq '[.jobs[] | select(.name == "FORGE ready")][0].id // empty')"
          test -n "${job_id}" || { echo "::error::o run ${run_id} não tem o job FORGE ready"; exit 1; }
          gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/jobs/${job_id}/rerun" > /dev/null
          echo "FORGE ready do run ${run_id} a correr outra vez (job ${job_id})"
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

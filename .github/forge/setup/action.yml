name: Preparar o projeto
description: As ferramentas dos comandos de verificação do forge-proof (do projeto, e não do FORGE).
runs:
  using: composite
  steps:
    - name: ruff e pip-audit, fixados
      shell: bash
      run: python -m pip install --quiet ruff==0.6.9 pip-audit==2.9.0
    - name: gitleaks 8.30.1, com o checksum conferido
      shell: bash
      run: |
        curl -sSLo /tmp/gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
        echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gl.tgz" | sha256sum -c -
        sudo tar -xzf /tmp/gl.tgz -C /usr/local/bin gitleaks

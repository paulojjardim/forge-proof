# .forge/project.yaml — FORGE
# Engineering with AI, by design.

project:
  name: loja

authority:
  functional: Paulo Jardim
  accounts: paulojjardim
  solo: yes
  require_work_approval: yes

profile:
  default: STANDARD

executor:
  instructions: AGENTS.md
  account: paulojjardim-forge-agent[bot]

verification:
  test: python -m unittest discover -s tests
  build: python -m compileall -q loja.py
  lint: ruff check .
  security_scan: python -m forge_tools.vulnerabilities python -- -r requirements.txt
  coverage: python -m forge_tools.coverage coverage.xml
  secrets: python -m forge_tools.secrets

coverage:
  2027-01-10: 30
  2027-04-10: 50
  2027-10-10: 70

packs:
  - github
  - python
